<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab ReTitle+</title>
  <link rel="stylesheet" href="./styles/popup.css">
</head>
<body class="m-0 p-0">
  <div id="app" class="w-96 p-4 bg-white">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">Tab ReTitle+</h1>

    <div class="mb-4">
      <label for="title-input" class="block text-sm font-medium text-gray-700 mb-2">
        Custom Title
      </label>
      <input
        type="text"
        id="title-input"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none"
        placeholder="e.g., [PROD] {original}"
        autofocus
      />
      <div id="preview-container" class="mt-2 hidden">
        <div class="text-xs font-medium text-gray-600 mb-1">Preview:</div>
        <div id="title-preview" class="text-sm px-3 py-2 bg-blue-50 border border-blue-200 rounded text-blue-900 font-medium"></div>
      </div>
      <p class="mt-1 text-xs text-gray-500">
        Use <code class="bg-gray-100 px-1 rounded">{original}</code> or <code class="bg-gray-100 px-1 rounded">$0</code> to include the original title
      </p>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Storage Type
      </label>
      <div class="space-y-2">
        <label class="flex items-center cursor-pointer">
          <input type="radio" name="storage-type" value="once" checked class="mr-2 text-primary-600 focus:ring-primary-600">
          <span class="text-sm text-gray-700">One-time (this session only)</span>
        </label>
        <label class="flex items-center cursor-pointer">
          <input type="radio" name="storage-type" value="tab" class="mr-2 text-primary-600 focus:ring-primary-600">
          <span class="text-sm text-gray-700">Tab-specific (persists for this tab)</span>
        </label>
        <label class="flex items-center cursor-pointer">
          <input type="radio" name="storage-type" value="url" class="mr-2 text-primary-600 focus:ring-primary-600">
          <span class="text-sm text-gray-700">Exact URL</span>
        </label>
        <label class="flex items-center cursor-pointer">
          <input type="radio" name="storage-type" value="domain" class="mr-2 text-primary-600 focus:ring-primary-600">
          <span class="text-sm text-gray-700">Domain-wide</span>
        </label>
      </div>
    </div>

    <div class="flex gap-2 mb-3">
      <button
        id="save-btn"
        class="flex-1 bg-primary-600 text-white px-4 py-2 rounded-md hover:bg-primary-700 transition-colors font-medium"
      >
        Save Title
      </button>
      <button
        id="clear-btn"
        class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors text-gray-700 font-medium"
      >
        Clear
      </button>
    </div>

    <!-- Existing Rules Section -->
    <div id="existing-rules-container" class="mb-4 hidden">
      <div class="border-t border-gray-200 pt-4">
        <h3 class="text-sm font-semibold text-gray-700 mb-2">Saved Rules for This Page</h3>
        <div id="existing-rules-list" class="space-y-2">
          <!-- Rules will be inserted here -->
        </div>
      </div>
    </div>

    <div class="text-xs text-gray-500 border-t border-gray-200 pt-3">
      <p class="mb-1">
        <span class="font-medium">Shortcut:</span> <kbd class="px-1.5 py-0.5 bg-gray-100 border border-gray-300 rounded text-xs font-mono">Ctrl+Shift+E</kbd>
        <span class="text-gray-400 ml-1">(customizable in <a href="#" id="open-options" class="text-blue-600 hover:underline">Options</a>)</span>
      </p>
      <p class="mb-1">
        <span class="font-medium">Current URL:</span><br>
        <span id="current-url" class="font-mono text-gray-600"></span>
      </p>
      <p id="current-title-display" class="hidden">
        <span class="font-medium">Current Title:</span><br>
        <span id="current-title" class="text-gray-600"></span>
      </p>
    </div>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
